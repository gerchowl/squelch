# Supply-chain policy. `nix flake check` runs this automatically — devkit's
# Rust pack turns the `deny` check on when this file exists, so adopting a
# policy is writing one and adopting none is doing nothing.
#
# It matters more here than in most crates. squelch is a *library that ships
# inside other people's binaries*, and it is on the path a user's secrets take
# on their way to a public tracker. Every transitive dependency it pulls is one
# a consumer inherits without choosing, in exactly the code they are trusting
# to be careful.

[graph]
# Every feature, because the interesting dependencies are all optional:
# `endpoint` brings the HTTP client, `logs` and `schema` bring serde_json.
# Checking the default set would scan the one configuration with almost no
# dependencies in it.
all-features = true

[advisories]
version = 2
# No ignores. An advisory this crate has decided to live with should be written
# down here with the reason and the date; an empty list is the claim that there
# are none, which is worth having to keep true.
ignore = []

[licenses]
version = 2
# squelch is `MIT OR Apache-2.0`. A dependency under a stronger copyleft would
# quietly impose terms on every consumer who never read this crate's tree.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  # `webpki-roots` — Mozilla's CA bundle, which arrives with rustls under the
  # `endpoint` feature. A data licence rather than a code one, and permissive;
  # the alternative is a TLS stack with no root store, which is worse.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The list is exactly what the tree uses today. cargo-deny warns on an
# allowance nothing matched, and that warning is worth keeping true: an
# aspirational list quietly stops describing what is actually being permitted.

[bans]
# `warn`, not `deny`: a duplicate version is usually someone else's lag, and
# failing the build over it teaches people to ignore the check.
multiple-versions = "warn"
# A wildcard version is an unbounded promise about code nobody has read.
wildcards = "deny"
deny = [
  # `ureq` is configured `default-features = false, features = ["tls", "json"]`
  # so it resolves rustls. Pinning that as policy rather than as a line in
  # Cargo.toml: a C TLS stack inside a crate that ships in other people's
  # binaries is a system dependency, a build break on musl and Windows, and a
  # CVE stream every consumer inherits. If this ever fires, the feature flags
  # drifted.
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
