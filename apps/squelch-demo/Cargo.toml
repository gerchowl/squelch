[package]
name = "squelch-demo"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "A minimal CLI embedding squelch — the reporter surface, end to end"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Every route is enabled: this app exists to be driven across all of them by
# the end-to-end tests, including the two that transmit without a built-in
# review surface. A real consumer would enable only what it ships.
squelch = { path = "../..", features = ["gh-cli", "endpoint"] }
clap = { version = "4", features = ["derive"] }
