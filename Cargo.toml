# The demo app is a workspace member rather than an example, so the end-to-end
# tests drive squelch across a crate boundary — through exactly the public API
# a real consumer has, with a missing `pub` becoming a compile error rather
# than something no test can see.
[workspace]
members = ["apps/squelch-demo"]

[package]
name = "squelch"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Let your users file a genuinely useful bug report: collect environment, redact the logs, open a prefilled GitHub issue form"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gerchowl/squelch"
keywords = ["bug-report", "issue", "redaction", "github", "diagnostics"]
categories = ["command-line-interface", "development-tools::debugging"]
readme = "README.md"
# `/.github` is repository furniture, not crate content — but `tests/issue_form.rs`
# reads it, so that test has to leave with it. It asserts a property of the
# *repository* (the ids this repo's own examples prefill are declared by the
# issue form this repo ships), which is meaningless once unpacked from a
# .crate. Publishing it would hand every downstream a test that panics on a
# missing file.
exclude = ["/.github", "/target", "/tests/issue_form.rs"]

[features]
default = ["browser", "logs"]

# Open the prefilled issue form in the user's browser.
browser = []
# Extract and redact structured (JSONL) log records.
logs = ["dep:serde_json"]
# Submit through a project-hosted HTTP endpoint. Pulls in a blocking HTTP
# client — read the abuse warning on `Transport::Endpoint` before enabling.
#
# `serde_json` is a real dependency of this feature, not a convenience: the
# route serialises its payload with `json!`. It was missing here and the crate
# simply did not compile with `endpoint` unless `logs` happened to be on too.
# Nothing in CI saw it — `--all-features` enables `logs`, and the dev-dependency
# on serde_json masks it for anything built with tests. Only a consumer using
# `default-features = false` hit it.
endpoint = ["dep:ureq", "dep:serde_json"]
# Submit with the `gh` CLI when it is installed and authenticated.
gh-cli = []
# `Form::json_schema` for an agent-tool surface. Its own feature rather than a
# corner of `logs`: an agent surface wants the schema and has no reason to want
# JSONL log parsing, and the return type is `serde_json::Value`, so a consumer
# calling it depends on serde_json regardless.
schema = ["dep:serde_json"]
# Derive serde on the form model, so a consumer can load a Form from whatever
# format they already use — YAML, JSON, TOML, RON. squelch takes no format
# dependency of its own; you bring the deserializer.
serde = ["dep:serde"]

[dependencies]
# The scrubber's rules. The one unconditional dependency: redaction is the
# reason this crate exists, so it is not behind a feature flag.
# Trimmed to what the patterns actually use. `unicode-case` is required by the
# case-insensitive rules; ASCII-only folding (`(?i-u)`) was tried and rejected
# because a negated ASCII class under `-u` can match invalid UTF-8, which the
# crate refuses to compile.
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }
ureq = { version = "2", optional = true, default-features = false, features = ["tls", "json"] }

# getpwuid, so the scrubber still knows the home directory and username when a
# service manager strips HOME and USER from the environment. Unix-only; no cost
# elsewhere.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
# A YAML parser, in dev only, so `tests/issue_form.rs` can run this repo's own
# `.github/ISSUE_TEMPLATE/bug.yml` through `form::github::IssueForm`. The
# crate's headline claim about the form model is that you can deserialize it
# from the YAML you already keep in `.github/ISSUE_TEMPLATE/` — and until this
# test, nothing checked that against real YAML. The only coverage was one
# hand-written JSON blob, which exercises serde's derive and none of GitHub's
# actual syntax.
#
# `serde_yaml_ng` rather than `serde_yaml`: the latter has been archived
# unmaintained since 2024, and `deny.toml` would rightly refuse it.
#
# A dev-dependency, so no consumer inherits it, and no feature of the published
# crate can reach it. `cargo hack --feature-powerset --no-dev-deps` (a flake
# check) is what proves that rather than assumes it.
serde_yaml_ng = "0.10"

[[example]]
name = "file_a_bug"
required-features = ["logs"]

[package.metadata.docs.rs]
all-features = true
